name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ci-build-error.txt
      - ci-build-status.txt
      - 'ml/**'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize frozen ML 6.1 core
        shell: bash
        run: |
          SRC="app/src/main/java/com/example/pooltrajectory/GeometryFirstAnalyzerV61.kt"
          mkdir -p "$(dirname "$SRC")"
          base64 -d ci/GeometryFirstAnalyzerV61.kt.gz.b64 | gzip -d > "$SRC"
          grep -q "class GeometryFirstAnalyzerV61" "$SRC"
          grep -q "findNativeGhostAlongRay" "$SRC"
          grep -q "chooseTargetAroundGhost" "$SRC"
          grep -q "class GeometryFirstAnalyzerV62" app/src/main/java/com/example/pooltrajectory/GeometryFirstAnalyzerV62.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PoolTrajectoryOffline-v6.2.apk
          fi
          exit 0

      - name: Save failure report to repository
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          {
            echo "Build failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "==== Key errors ===="
            grep -nEi "(^|[[:space:]])(error:|e: |FAILURE:|What went wrong:|Could not|Execution failed|Unresolved reference|Compilation error|AAPT:|Manifest merger failed)" build.log | tail -n 160 || true
            echo
            echo "==== Last 350 log lines ===="
            tail -n 350 build.log
          } > ci-build-error.txt
          printf 'FAILED\nversion=6.2\ncommit=%s\ntime=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > ci-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-error.txt ci-build-status.txt
          git commit -m "Save Android build failure [skip ci]" || true
          git push

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Save success status and materialized source
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          printf 'SUCCESS\nversion=6.2\ncommit=%s\ntime=%s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > ci-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-status.txt app/src/main/java/com/example/pooltrajectory/GeometryFirstAnalyzerV61.kt app/src/main/java/com/example/pooltrajectory/GeometryFirstAnalyzerV62.kt
          git commit -m "Record ML 6.2 build and guarded source [skip ci]" || true
          git push

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: PoolTrajectoryOffline-v6.2
          path: app/build/outputs/apk/debug/PoolTrajectoryOffline-v6.2.apk
          if-no-files-found: error

      - name: Publish direct APK download
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/PoolTrajectoryOffline-v6.2.apk"
          if gh release view v6.2 >/dev/null 2>&1; then
            gh release upload v6.2 "$APK" --clobber
          else
            gh release create v6.2 "$APK" \
              --title "Pool Trajectory Offline v6.2" \
              --notes "ML 6.2 deliberately wraps the frozen 6.1 ghost-first core instead of replacing it. The new guard layer retains the last verified geometry only when an abrupt aim jump is accompanied by a much shorter or weaker native guide, detects sudden rayFallback target jumps after a stable nativeGhost frame, rejects only clearly weak fallback evidence, and calibrates accepted fallback confidence to a maximum of 82 with strong ghost evidence or 72 without it. Rendered object/cue branch starts may be snapped backward by a small bounded amount to meet nearby native white post-contact pixels without changing target, collision normal, or branch direction. Target-circle refitting and deeper detector rewrites are intentionally deferred until 6.2 field diagnostics prove they can improve accuracy without regression."
          fi
