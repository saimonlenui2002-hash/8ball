name: Build Durak Lens APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "durak-lens/**"
      - ".github/workflows/build-durak-lens.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: durak-lens

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DurakLens-debug-apk
          path: durak-lens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
